name: Run ASR evaluation (sample)

on:
  workflow_dispatch:

jobs:
  run-eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run sample evaluation
        run: |
          python -c "from asr_validator.pipeline import judge_segment; import json,sys; print(json.dumps(judge_segment('把灯打开','开灯'),ensure_ascii=False,indent=2))"
